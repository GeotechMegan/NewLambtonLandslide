<!doctype html>

<head>
  <meta charset="utf-8">
  <title>Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;padding:40px 60px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#000}
    h1{text-align:center;margin:0 0 30px 0;font-size:2.2rem;font-weight:normal}
    nav{display:flex;justify-content:space-between;max-width:900px;margin:0 auto 30px auto}
    nav a{text-decoration:none;color:#000;font-size:1.2rem}
    nav a:hover{text-decoration:underline}
    .content{max-width:900px;margin:0 auto;font-size:1rem;line-height:1.6;position:relative}
    details{margin:18px 0;border:1px solid #000}
    summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:bold}
    summary::-webkit-details-marker{display:none}
    summary:before{content:"▶";display:inline-block;width:18px}
    details[open] summary:before{content:"▼"}
    .goalwrap{padding:0 12px 12px 12px}
    table{width:100%;border-collapse:collapse;margin:10px 0 14px 0;table-layout:fixed}
    th,td{border:1px solid #000;padding:8px 10px;vertical-align:top;word-wrap:break-word}
    th{font-weight:bold;text-align:left}
    .cell{display:flex;flex-direction:column;gap:10px}
    .cell .celltext{min-height:22px}
    .comment-thread{border:1px solid #000;padding:10px}
    .cwrap{display:block}
    .cform textarea{width:100%;min-height:70px;resize:vertical;font-family:Arial,Helvetica,sans-serif;font-size:1rem;padding:8px;border:1px solid #000;box-sizing:border-box}
    .cform button{margin-top:8px;padding:6px 10px;border:1px solid #000;background:#fff;cursor:pointer;font-size:0.95rem}
    .clist{margin-top:10px;display:flex;flex-direction:column;gap:10px}
    .citem{border:1px solid #000;padding:8px}
    .chead{display:flex;justify-content:space-between;gap:10px;font-size:0.9rem}
    .cname{font-weight:bold}
    .ctime{opacity:0.85}
    .cbodytext{margin-top:6px;white-space:pre-wrap}
    .cactions{margin-top:8px;display:flex;gap:8px}
    .cactions button{padding:4px 8px;border:1px solid #000;background:#fff;cursor:pointer;font-size:0.9rem}
    hr{border:0;border-top:1px solid #000;margin:30px 0}
    .sidebtns{position:fixed;right:14px;top:140px;display:flex;flex-direction:column;gap:10px}
    .sidebtns a{border:1px solid #000;padding:8px 10px;text-decoration:none;color:#000;background:#fff;font-size:0.95rem;text-align:center}
    .sidebtns a:hover{background:#f2f2f2}
    @media (max-width: 980px){.sidebtns{display:none} body{padding:24px 18px}}
  </style>
